title: DFCC Rates & Card Offers
host: https://www.dfcc.lk
tier: B
category: banks
probe_delay_seconds: 1.0
ethics: See docs/ETHICS.md
source_docs_in_lankawa:
- docs/BANK_API_DEEP_DIVE_BOC_PEOPLES_NDB_DFCC_PABC.md
endpoints:
- id: interest_rates_page
  method: GET
  url: https://www.dfcc.lk/rates-and-tariff
  path: /rates-and-tariff
  summary: RSC-embedded deposit/loan rates. Old /interest-rates/ now redirects here (2 hops) — pointed directly at the canonical URL to avoid redirect fragility. Verified 2026-09-14.
  access: html_scrape
- id: exchange_rates_page
  method: GET
  url: https://www.dfcc.lk/treasury/foreign-exchange
  path: /treasury/foreign-exchange
  summary: FX rates page. Old /exchange-rates/ page has a genuine server-side infinite redirect bug on DFCC's own server right now (it 308-redirects to itself — confirmed via curl AND a real browser, not a probe/UA issue). Switched to the working /treasury/foreign-exchange page found via site nav. Verified 2026-09-14.
  access: html_scrape
- id: card_offers_supermarket
  method: GET
  url: https://www.dfcc.lk/cards/card-offers/credit-card-offers
  path: /cards/card-offers/credit-card-offers
  summary: 'Card offers hub (supermarket DOW scrape). CORRECTED 2026-09-14:
    the previous URL (/personal/cards/card-offers) was a soft-404 — HTTP 200
    with a literal "Page Not Found" page body, not caught by the earlier fix
    because that fix only checked HTTP status, not content. Real page found
    via site nav: /cards/card-offers is the hub (behind a cookie-consent
    banner that blocks rendering until accepted), with the actual offer
    list one level deeper at /credit-card-offers. NOTE: even this correct
    URL currently renders with zero offers listed on DFCC''s own site —
    verified via a real browser with cookies accepted, not a scraping
    issue on our end. Re-check periodically in case DFCC populates it.'
  access: html_scrape
